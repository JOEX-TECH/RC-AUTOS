<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC AUTOS | Milla de Oro Medellín</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --red:#E31E24;
    --black:#050505;
    --white:#fff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#000;
    color:#fff;
    font-family:Arial;
    overflow-x:hidden;
}

/* LOADER CARRO */
#loader{
    position:fixed;
    width:100%;
    height:100vh;
    background:#000;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:9999;
}

#loader i{
    font-size:60px;
    color:var(--red);
    animation:car 1.5s ease forwards;
}

@keyframes car{
    0%{transform:translateY(200px);opacity:0;}
    50%{opacity:1;}
    100%{transform:translateY(-120vh);opacity:0;}
}

/* HERO VIDEO */
#hero{
    height:100vh;
    position:relative;
}

#hero video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#000 30%,transparent);
}

.content{
    position:relative;
    z-index:2;
    padding:100px 8%;
}

h1{
    font-size:60px;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 30px;
    background:var(--red);
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

/* HEADER */
header{
    position:fixed;
    width:100%;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    z-index:1000;
}

header img{width:120px;}

/* AUDIO */
#audio-player{
    position:fixed;
    bottom:30px;
    left:30px;
    background:#000;
    padding:15px;
    border:1px solid var(--red);
    cursor:pointer;
}

/* WHATSAPP */
.ws{
    position:fixed;
    bottom:30px;
    right:30px;
    background:#25D366;
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:30px;
}

/* SECCION */
.section{
    padding:120px 8%;
    text-align:center;
}

</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
    <i class="fas fa-car-side"></i>
</div>

<!-- HEADER -->
<header>
    <img src="RC AUTOS.jpg">
    <a href="https://listado.mercadolibre.com.co/pagina/rcautos/vehiculos/_OrderId_PRICE*DESC_NoIndex_True" class="btn" target="_blank">CATÁLOGO</a>
</header>

<!-- HERO -->
<section id="hero">
    <video autoplay muted loop playsinline>
        <source src="video rc.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <h1>SIENTE EL PODER</h1>
        <p>Compra y venta de vehículos premium en Medellín</p>

        <a href="https://listado.mercadolibre.com.co/pagina/rcautos/vehiculos/_OrderId_PRICE*DESC_NoIndex_True" target="_blank" class="btn">
            VER CATÁLOGO
        </a>
    </div>
</section>

<!-- SECCION -->
<section class="section">
    <h2>RC AUTOS</h2>
    <p>Experiencia premium en vehículos de alta gama.</p>
</section>

<!-- AUDIO -->
<div id="audio-player" onclick="toggleAudio()">
    <i class="fas fa-play" id="icon"></i>
</div>

<audio id="audio" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- WHATSAPP -->
<a href="https://wa.me/573043741941" class="ws" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<script>

/* LOADER */
window.onload = () => {
    setTimeout(()=>{
        document.getElementById("loader").style.display="none";
    },1500);
}

/* AUDIO */
let audio = document.getElementById("audio");
let icon = document.getElementById("icon");

function toggleAudio(){
    if(audio.paused){
        audio.play();
        icon.className="fas fa-pause";
    }else{
        audio.pause();
        icon.className="fas fa-play";
    }
}

</script>

</body>
</html>
